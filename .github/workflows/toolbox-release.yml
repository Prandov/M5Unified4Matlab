# Created with GPT6A for the MATLAB Project and toolbox release workflow.
name: Build MATLAB toolbox

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check release version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'VERSION must contain major.minor.patch'; exit 1;
          }
          if [[ "$EVENT_NAME" == push && "$REF_NAME" != "v$version" ]]; then
            echo "Tag $REF_NAME does not match VERSION ($version)"; exit 1
          fi

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a

      - name: Build toolbox
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(fullfile(pwd, 'development', 'packaging')); buildToolbox

      - name: Verify installed folder layout
        shell: bash
        run: python development/tests/verify_toolbox_layout.py release/*.mltbx

      - name: Calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum ./*.mltbx > SHA256SUMS.txt

      - name: Save installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: matlab-toolbox
          path: |
            release/*.mltbx
            release/SHA256SUMS.txt
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: matlab-toolbox
          path: release

      - name: Create draft release with installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release/*.mltbx release/SHA256SUMS.txt \
            --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
